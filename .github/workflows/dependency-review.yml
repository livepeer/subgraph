name: Dependency Review

on:
  pull_request:

# Fails the PR if it introduces a dependency with a known vulnerability.
jobs:
  dependency-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          # decompress (no patched release) is pulled in by graph-cli and only
          # loaded by `graph node`, which this repo never runs.
          allow-ghsas: GHSA-mp2f-45pm-3cg9
